profiling_task:
  description: |
    Profile the structural metadata of the discovered raw source files: {files}.
    Analyze each file and report:
    1. Row count, column count, and size.
    2. Column names, datatypes, and unique constraint footprint.
    3. Null distributions and percentage of missing values.
    Provide a precise JSON summary detailing these metadata properties for every file.
  expected_output: "A structured, parseable JSON dictionary summarizing the metadata properties, duplicates, and null distributions for every file."

quality_task:
  description: |
    Conduct a data quality check on the raw CSV datasets using the profiling summary: {profiling_results}.
    Analyze quality metrics such as formatting anomalies, domain rule violations, referential integrity gaps, and duplicates.
    Calculate a mathematical quality score out of 100 and report all findings.
  expected_output: "A markdown report documenting the severity of findings, specific anomalies, and ending with a clear line: 'Quality Score: [number]/100'."

schema_design_task:
  description: |
    Design a Kimball Star Schema for the provided e-commerce datasets.

    **Pre-classified entity types (use these as ground truth, do not re-classify):**
    {entity_map}

    **Full structural profiles:**
    {profiling_results}

    You must:
    1. Accept the entity classification above as definitive. For each file, state which Fact or Dimension
       table it maps to. 'orders' / 'order_items' → Fact tables. 'products' / 'customers' / 'inventory'
       → Dimension tables. 'financials' → separate Fact_Financials. 'sessions' / 'pageviews' → Fact_Sessions
       / Fact_Pageviews. 'unknown' → document as 'unclassified, excluded from warehouse'.
    2. For any file with confidence < 0.40 or an ambiguity note, call out the ambiguity and state your
       chosen interpretation with reasoning.
    3. List which typical e-commerce concepts are missing (no data provided).
    4. Design the Kimball Star Schema: Fact tables, Dimension tables, grain definitions, and FK relationships.
       Base it only on files that have a non-unknown entity classification.
    5. Note any schema shifts detected in the profiling report and how they should be handled in SQL.
    6. Naming Convention (REQUIRED for pipeline auto-discovery): ALL fact tables MUST be named with a
       `Fact_` prefix (e.g. Fact_Orders, Fact_Sessions, Fact_Financials). ALL dimension tables MUST be
       named with a `Dim_` prefix (e.g. Dim_Products, Dim_Customers, Dim_Date). The pipeline scans for
       `Fact_*` tables after SQL execution — any fact table without this prefix will be invisible to the
       validation and retry logic.
  expected_output: "A markdown document with: entity mapping table, missing concepts, star schema layout with grain definitions, schema shift handling notes, and explicit Fact_/Dim_ table names."

transformation_task:
  description: |
    Generate a DuckDB SQL script to load and transform raw tables into the designed star schema based on
    the quality report: {quality_report} and star schema design: {star_schema}.

    **Pre-classified entity types (ground truth — do not override):**
    {entity_map}

    **DuckDB Registered Tables Mapping:**
    {table_mapping_text}

    The script must:
    1. Deduplicate records.
    2. Standardize dates to ISO 8601 and handle null values:
       - Analyze the sample date strings shown in the profiling report for each raw table to identify date layout variations (such as two-digit vs four-digit years, delimiters, or month/day order).
       - Never use loose casting (like `try_cast` or `cast`) for converting date strings with custom or ambiguous formats, as automatic casting can parse them into incorrect calendar years (e.g., treating short years as years in the first century), which will violate date/calendar dimension foreign key constraints.
       - Instead, always use explicit parsing functions like `try_strptime(column, 'format_pattern')` with the precise format pattern matched to the raw table samples.
    3. Preserve ALL source rows — do NOT filter on referential integrity. Every row from the source
       transaction files must be inserted into the Fact table. If a SKU cannot be resolved to Dim_Product
       or a date cannot be resolved to Dim_Date, set that FK column to NULL rather than dropping the row.
       Sub-select filters like `WHERE SKU IN (SELECT SKU FROM Dim_Product)` or `WHERE Date_Key IN
       (SELECT Date_Key FROM Dim_Date)` in Fact INSERT statements are strictly FORBIDDEN — they silently
       discard valid transactions without any alert or error. The Validation Engineer will independently
       measure data retention rates after load; do not pre-filter to make those checks pass.
    4. Create persistent star schema tables.
    5. Ensure strict data type consistency: Every key column (such as product_id, order_id, user_id, website_session_id, refund_id) MUST share the exact same data type (e.g., all cast to BIGINT or all cast to VARCHAR) across all tables to avoid comparison failures in joins or IN clauses.
    6. Strict Adherence to Discovered Column Names: When writing queries against the raw source tables, you MUST use the exact column names shown in the profiling JSON reports. Do NOT assume generic names.
    7. Valid SQL Alias Syntax: Within a single SELECT clause, never reference a column alias within another column expression. You must reference the original source column or use a Common Table Expression (CTE) first.
    8. DuckDB SQL Syntax constraints:
       - The `WHERE` clause must ALWAYS precede the `QUALIFY` clause in any SELECT statement (e.g., SELECT ... FROM ... WHERE ... QUALIFY ...). Never write QUALIFY before WHERE.
       - Casing of table names must match the DuckDB Registered Tables Mapping exactly. Do not use file extensions (like .csv) when referencing the views.
       - All inline comments/explanations inside the SQL block must be prefixed with `--`. Never output raw text explanations outside comment tags.
       - In DuckDB, generate_series returns a list (array) of timestamps. To expand it into rows, you MUST use the UNNEST function (e.g., SELECT UNNEST(generate_series(start_date, end_date, INTERVAL '1 day')) AS range_date). Casting raw generate_series result directly will fail.
    9. DuckDB STRUCT Type Pitfall (CRITICAL): When selecting from source views, ALWAYS select
       individual columns by name. NEVER use a bare table alias as an expression in SELECT
       (e.g., `SELECT t FROM table_name t` returns the entire row as a STRUCT, not a scalar).
       NEVER use a correlated subquery that returns an entire row (e.g.,
       `(SELECT t FROM tbl t WHERE t.key = a.key LIMIT 1)` also produces a STRUCT column).
       All columns in every warehouse table (Fact or Dimension) MUST be scalar types:
       VARCHAR, BIGINT, FLOAT, or DATE. A STRUCT column in a CREATE TABLE will cause every
       subsequent INSERT into that table to fail with an opaque type-mismatch error.
    10. Schema Shift Detection & Inconsistent Layouts:
       - Raw datasets may contain inconsistent row formats, mid-file schema transitions (e.g., secondary headers, shifted fields, or dummy separator rows).
       - When writing the SQL logic, identify if any source table exhibits such transitions. Use conditional clauses (e.g., `CASE WHEN` statements, `COALESCE` chains, or filtering on row indexes/content patterns) to dynamically map shifted columns to their correct target fields in the star schema.
       - Never use raw parsing functions like `strptime` on fields that might contain text, headers, or arbitrary formats; instead, use safe alternatives (like `try_strptime` or `try_cast`) and filter out nulls/invalid records afterwards to prevent execution failures.
    11. Data Retention Diagnostic: As the LAST statement in the SQL script (after all table loads), add a
        diagnostic SELECT reporting the row count of the primary Fact table and NULL counts for its two
        most important FK columns (the date dimension key and the product/item dimension key). Use the
        ACTUAL table and column names from your schema — NEVER hardcode Fact_Sales, Date_Key, SKU, or
        Channel_ID. Example structure (substitute your real names):
        SELECT '<YourFactTable>_total' AS metric, COUNT(*) AS value FROM <YourFactTable>
        UNION ALL SELECT 'Null_<DateFK>', COUNT(*) FILTER (WHERE <date_fk_col> IS NULL) FROM <YourFactTable>
        UNION ALL SELECT 'Null_<ProductFK>', COUNT(*) FILTER (WHERE <product_fk_col> IS NULL) FROM <YourFactTable>;
        This makes data loss immediately visible during validation.
    Provide clean, verified SQL syntax.
  expected_output: "A verified DuckDB SQL script containing CREATE TABLE and INSERT INTO SELECT statements for the star schema."

business_insights_task:
  description: |
    Execute advanced SQL queries against the persistent star schema tables in the database to derive business metrics and KPIs based on the transformation SQL: {clean_sql}.
    You must write and run queries to compute:
    1. **Core Sales Performance**: Total Revenue, Unique Orders, and Average Order Value (AOV).
    2. **Product Category Analysis**: Total sales volume and revenue contribution grouped by category (translating names to English where translation files exist).
    3. **Operations & Delivery Latency**: Average actual delivery days vs estimated delivery days, and average delivery delay (actual minus estimated days) grouped by customer location/state.
    4. **Customer Care & Rating Analytics (if review/satisfaction data exists)**:
       - Average customer review rating (CSAT) grouped by product category.
       - Late delivery correlation: Average review rating for orders delivered *late* vs orders delivered *on-time* (date arithmetic checking if actual delivery date exceeds estimated delivery date).
     5. **Marketing Attribution & Funnels (if web traffic/session data exists)**:
       - Conversion rates (Sessions-to-Orders conversion %) and Marketing channel performance (ROI and AOV by utm_source).
       - Bounce rates (single pageview sessions).
    If any of the source dimensions or facts are missing from the schema (e.g., no clickstream sessions or no support ticket files), report them as 'Not Available due to missing [Domain Name] logs' and skip them. Do not hallucinate any values.
  expected_output: "A markdown analytics report documenting in-depth statistical insights and exact tabular query outputs from the database."

final_report_task:
  description: |
    Synthesize and review all data warehouse deliverables across the pipeline:
    - Profiling Results: {profiling_results}
    - Quality Report: {quality_report}
    - Star Schema Design: {star_schema}
    - SQL Transformations: {clean_sql}
    - KPI Analysis: {kpi_report}
    Review technical consistency and prepare a final chief architect report summarizing the warehouse engineering and business recommendations.
  expected_output: "Comprehensive Markdown executive summary documenting the warehouse engineering results."

sql_fix_task:
  description: |
    The following DuckDB SQL script was generated to build a star schema warehouse, but some statements failed during execution.

    **Original SQL Script:**
    {original_sql}

    **Execution Errors:**
    {error_report}

    **Raw Data Profiling Metadata (column names and types):**
    {profiling_results}

    **DuckDB Registered Tables Mapping:**
    {table_mapping_text}

    **Primary fact table (auto-discovered after execution):** {primary_fact_table}

    **Entity map (source file → warehouse entity):**
    {entity_map}

    Fix ONLY the failed statements. Follow these strict constraints:
    1. Casing of table names must match the DuckDB Registered Tables Mapping exactly. Do not use file extensions.
    2. The `WHERE` clause must ALWAYS precede the `QUALIFY` clause (e.g., SELECT ... FROM ... WHERE ... QUALIFY ...). Never write QUALIFY before WHERE.
    3. All comments and explanations inside the SQL block must be prefixed with `--`. Never output plain text explanations inside the SQL block.
    4. In DuckDB, generate_series returns a list (array) of timestamps. To expand it into rows, you MUST use the UNNEST function (e.g., SELECT UNNEST(generate_series(start_date, end_date, INTERVAL '1 day')) AS range_date). Casting raw generate_series result directly will fail.
    5. Referencing column names that do not exist in the source tables. Use ONLY the exact column names from the profiling metadata above.
    6. Invalid SQL alias references within the same SELECT clause.
    7. Data type mismatches in JOIN or WHERE conditions.
    8. Diagnostic & Debugging Protocol for Schema Shifts:
       - If a transformation statement fails due to casting or parser exceptions (e.g., date parsing or conversion errors on specific string values), you MUST use your tools (like running queries on the raw views) to investigate the structure of the problematic rows.
       - Check if the dataset has a column/schema shift or multiple layouts in different portions of the file.
       - Resolve formatting anomalies using conditional logic (e.g., partitioning rows via `CASE WHEN` checks on indices or values, coalescing multiple date columns/formats, or dropping header/separator lines) rather than relying on a single uniform parsing format.
       - If a foreign key violation occurs on a date or calendar dimension table, it typically indicates parsed dates falling outside the valid calendar range (e.g. due to incorrect year/century parsing). Verify if date values were parsed using loose casts versus precise format patterns. Correct the logic to use explicit parsing (e.g., `try_strptime(column, 'format_pattern')`) with the format string matching the raw data pattern.
    9. STRUCT Type Columns (CRITICAL): If the error mentions "can't be cast to the destination type STRUCT",
       the CREATE TABLE statement used a bare table alias as a SELECT expression
       (e.g., `SELECT t FROM table_name t`) or a correlated row-subquery
       (e.g., `(SELECT t FROM tbl t WHERE ...)`), which DuckDB returns as a STRUCT instead of a scalar.
       The fix is to rewrite the CREATE TABLE to SELECT individual named columns
       (e.g., `SELECT t.col1, t.col2 FROM table_name t`). All warehouse table columns MUST be
       scalar types (VARCHAR, BIGINT, FLOAT, DATE). Drop and recreate the affected table with the corrected SELECT.
    10. Data Retention Rule — strictly forbidden fix patterns: Do NOT resolve referential integrity errors by
       adding FK-membership filters to Fact INSERT statements. The following patterns are BANNED:
         - WHERE SKU IN (SELECT SKU FROM Dim_Product)
         - WHERE Date_Key IN (SELECT Date_Key FROM Dim_Date)
         - AND SKU IN (...) / AND Date_Key IN (...)
       These patterns silently delete transactions to make orphan-rate checks pass. They are the root cause
       of the data loss this pipeline is designed to prevent. Instead, remove any such filter and let the FK
       column be NULL for unresolvable values. The target is >= 90% row retention in {primary_fact_table}
       compared to the combined row count of the source transaction tables.

    Return the COMPLETE corrected SQL script (including statements that already succeeded unchanged) as a single executable DuckDB SQL block.
  expected_output: "A fully corrected DuckDB SQL script inside a ```sql code block, ready for re-execution."

validation_task:
  description: |
    Conduct an independent ground-truth validation audit on the populated star schema.
    You have access to BOTH the raw source CSV views AND the persistent warehouse tables in the same
    DuckDB connection.

    Primary fact table: {primary_fact_table}
    Source file row counts: {source_row_counts}
    Entity map: {entity_map}

    IMPORTANT: Run SHOW TABLES first, then DESCRIBE {primary_fact_table} to discover the actual column
    names before writing any check queries. Do NOT assume column names. SKU, Date_Key, Gross_Amount,
    Sale_ID, Quantity, and Channel_ID are Amazon-specific and will not exist on other datasets.
    Use only column names revealed by DESCRIBE {primary_fact_table}.

    ALL checks are mandatory; run them in order.

    **Check 1 — Data Completeness (MOST CRITICAL):**
    - Sum all values in source_row_counts to get total_source_rows.
    - Query SELECT COUNT(*) FROM {primary_fact_table} to get fact_rows.
    - Compute retention = CAST(fact_rows AS FLOAT) / total_source_rows * 100.
    - FAIL if retention < 88%.
    - A rate below 88% means the transformation SQL used FK-membership WHERE filters that silently
      deleted valid transactions.

    **Check 2 — Revenue Reconciliation:**
    - Use DESCRIBE {primary_fact_table} to find the revenue/amount column (numeric column whose name
      contains 'amount', 'revenue', 'price', 'value', 'total', or 'sales').
    - SUM that column from the raw source view and from {primary_fact_table}.
    - FAIL if variance exceeds 10%.

    **Check 3 — Null FK Rate:**
    - Use DESCRIBE {primary_fact_table} to find the date FK column and the product/item FK column.
    - Compute CAST(COUNT(*) FILTER (WHERE <date_fk_col> IS NULL) AS FLOAT) / COUNT(*) * 100.
    - FAIL if the date FK NULL rate exceeds 20% (indicates systemic date-parsing failure).

    **Check 4 — Quantity / Volume Bounds:**
    - Use DESCRIBE {primary_fact_table} to find a quantity or units column (name contains 'qty',
      'quantity', 'units', or 'count').
    - If such a column exists: compute AVG, MIN, MAX.
    - FAIL if AVG > 1000 (indicates a column-shift leak — price values landed in a quantity column).
    - If no such column exists, mark this check N/A.

    **Check 5 — Revenue Integrity:**
    - Using the revenue column discovered in Check 2, count rows WHERE <revenue_col> < 0 in
      {primary_fact_table}.
    - FAIL if any negative revenue rows exist.

    **Check 6 — Dimension Deduplication:**
    - For each Dim_* table discovered by SHOW TABLES, use DESCRIBE to find its primary key column.
    - Check SELECT COUNT(*) - COUNT(DISTINCT <pk_col>) FROM <dim_table> for each dimension.
    - FAIL if any dimension has duplicate primary keys (result > 0).

    **Check 7 — Cartesian Product Check:**
    - Use DESCRIBE {primary_fact_table} to find the row identifier / transaction ID column.
    - Compute CAST(COUNT(*) AS FLOAT) / COUNT(DISTINCT <id_col>) FROM {primary_fact_table}.
    - FAIL if ratio exceeds 5.0 (indicates a join explosion from non-unique key usage).

    Compile a complete audit report with the exact SQL executed and the actual numeric result for each check.
    The report MUST end with exactly one of:
    'Validation Status: PASS'
    'Validation Status: FAIL'
    If FAIL, list each failing check with its actual value and the threshold it violated.
  expected_output: "A detailed markdown validation report listing SQL executed, actual statistics, and ending with 'Validation Status: PASS' or 'Validation Status: FAIL' with error reasons."
