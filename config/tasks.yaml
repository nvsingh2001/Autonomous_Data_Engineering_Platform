profiling_task:
  description: "Profile the CSV datasets in the 'data' folder: {files}. Determine row and column count, data types, null counts, duplicate counts, and structural characteristics."
  expected_output: "JSON profiling summary outlining statistics, duplicate count, and null columns for each file."

quality_task:
  description: "Perform a thorough data quality analysis of the raw CSV files. Use the following profiling summary for reference: {profiling_results}. Identify format inconsistencies (dates, phones), duplicate IDs, negative values, and referential integrity issues. Compute a final dataset quality score (out of 100) and list anomalies."
  expected_output: "Markdown quality report identifying bugs and ending with a clear line: 'Quality Score: [number]/100'."

schema_design_task:
  description: "Inspect column relationships and design a Star Schema for an analytics data warehouse. Refer to the profiling results: {profiling_results}. Identify which tables are Fact tables and which are Dimension tables (e.g. DimCustomer, DimProduct, DimDate). Specify relationships, primary keys, and foreign keys."
  expected_output: "Markdown document outlining the star schema layout, Fact and Dimension tables, and key mappings."

transformation_task:
  description: "Generate SQL data transformation scripts (using DuckDB SQL syntax) to clean raw tables and populate the Star Schema. Refer to the quality report: {quality_report} and star schema design: {star_schema}. Deduplicate records, standardize dates and phones, handle missing values, filter negative values, and ensure referential integrity. Generate CREATE TABLE and INSERT INTO SQL queries."
  expected_output: "SQL script containing clean DuckDB SQL statements for creating and loading the star schema tables."

business_insights_task:
  description: "Query the star schema tables to calculate business KPIs (revenue, sales volumes, category distributions, support ratings). Refer to the transformations SQL script: {clean_sql}. Identify patterns like customer tier revenue share and ticket resolution metrics."
  expected_output: "Markdown report with key business KPIs and summary of findings."

final_report_task:
  description: "Review all data warehouse deliverables. Profiling Results: {profiling_results}\nQuality Report: {quality_report}\nStar Schema Design: {star_schema}\nTransformations SQL: {clean_sql}\nKPI Report: {kpi_report}\nSynthesize them into a final executive summary and recommendations package."
  expected_output: "Comprehensive Markdown executive summary documenting the warehouse engineering results."
